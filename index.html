<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Estúdio de Dublagem Gabura</title>
    <meta name="description" content="Grave as vozes dos personagens do Gaburaverso, escolha o efeito de cada um e exporte para o jogo. Funciona offline." />
    <meta name="theme-color" content="#0c1a24" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icones/icone-192.png" />
    <link rel="apple-touch-icon" href="./icones/icone-192.png" />
  </head>
  <body>
    <div id="app">
      <p class="carregando">Carregando o estúdio…</p>
      <p id="aviso-publicacao" hidden style="max-width:560px;margin:0 auto;padding:0 20px;font-family:system-ui,sans-serif;line-height:1.5">
        O estúdio não abriu. Se este endereço é o GitHub Pages, confira no repositório:
        <b>Settings → Pages → Source: GitHub Actions</b>. Depois, na aba <b>Actions</b>,
        rode de novo "Publicar no GitHub Pages".
      </p>
    </div>
    <script>
      // Se em 6 s o app não substituiu esta tela, mostra a dica de publicação.
      setTimeout(function () {
        if (document.querySelector('.carregando')) document.getElementById('aviso-publicacao').hidden = false;
      }, 6000);
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
